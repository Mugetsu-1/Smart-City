version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: transit_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: transit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
